<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Meeting Assistant</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; }
    textarea { width: 100%; height: 240px; padding: 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    input[type="text"] { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 24px; font-size: 15px; border: none; border-radius: 8px; background: #3b82f6; color: white; cursor: pointer; }
    button:disabled { background: #9ca3af; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #e5e7eb; padding: 8px 10px; font-size: 14px; text-align: left; }
    th { background: #f9fafb; }
    #minutes-view { margin-top: 24px; display: none; }
    .card { padding: 16px; background: #f3f4f6; border-radius: 8px; margin-bottom: 12px; }
    #raw-json { padding: 16px; background: #1e293b; color: #a5f3fc; border-radius: 8px; overflow-x: auto; font-size: 13px; }
    #answer { margin-top: 16px; padding: 16px; background: #eff6ff; border-radius: 8px; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>
  <h1>📝 AI Meeting Assistant <small style="color:#888">v6</small></h1>
  <p>회의 내용을 붙여넣고 회의록을 생성하세요.</p>
  <textarea id="meeting-text" placeholder="회의 내용을 입력하세요..."></textarea>
  <button id="minutes-btn">회의록 생성</button>

  <!-- 서버는 데이터(JSON)를 주고, 화면이 그린다 -->
  <div id="minutes-view">
    <div class="card">
      <strong>한 줄 요약</strong>
      <p id="mv-summary" style="margin:8px 0 0;"></p>
    </div>
    <div class="card">
      <strong>결정사항</strong>
      <ul id="mv-decisions" style="margin:8px 0 0;"></ul>
    </div>
    <div class="card">
      <strong>Action Item</strong>
      <table>
        <thead><tr><th>담당자</th><th>할 일</th><th>기한</th></tr></thead>
        <tbody id="mv-actions"></tbody>
      </table>
    </div>
    <div class="card">
      <strong>다음 일정</strong>
      <ul id="mv-schedule" style="margin:8px 0 0;"></ul>
    </div>
    <details>
      <summary style="cursor:pointer; color:#666;">서버가 보낸 원본 데이터 (JSON)</summary>
      <pre id="raw-json"></pre>
    </details>
  </div>

  <hr style="margin: 32px 0; border: none; border-top: 1px solid #e5e7eb;" />

  <h2>💬 회의에 대해 질문하기 <small id="meeting-count" style="color:#888">(기억 중인 회의: 0건)</small></h2>
  <input id="question" type="text" placeholder="예: 다음 회의 일정 캘린더에 등록해줘 / 회의록 노션에 저장해줘 / 결제 모듈 어떻게 하기로 했지?" />
  <button id="ask-btn">질문하기</button>
  <div id="answer"></div>

  <h2 style="margin-top:32px;">📅 팀 캘린더 <small id="calendar-count" style="color:#888">(0건)</small></h2>
  <ul id="calendar-list" style="padding-left:20px; color:#374151;"></ul>

  <script>
    const countLabel = document.getElementById("meeting-count");

    // 기억은 서버에 있다 — 페이지를 새로 열면 서버에 실제 개수를 물어본다
    fetch("/api/meetings")
      .then((res) => res.json())
      .then((data) => {
        countLabel.textContent = `(기억 중인 회의: ${data.meeting_count}건)`;
      });

    const minutesBtn = document.getElementById("minutes-btn");
    const minutesView = document.getElementById("minutes-view");

    function renderMinutes(m) {
      document.getElementById("mv-summary").textContent = m.one_line_summary;

      const decisions = document.getElementById("mv-decisions");
      decisions.innerHTML = "";
      m.decisions.forEach((d) => {
        const li = document.createElement("li");
        li.textContent = d;
        decisions.appendChild(li);
      });

      const actions = document.getElementById("mv-actions");
      actions.innerHTML = "";
      m.action_items.forEach((a) => {
        const tr = document.createElement("tr");
        [a.assignee, a.task, a.due ?? "-"].forEach((v) => {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        actions.appendChild(tr);
      });

      const schedule = document.getElementById("mv-schedule");
      schedule.innerHTML = "";
      (m.next_schedule.length ? m.next_schedule : ["없음"]).forEach((s) => {
        const li = document.createElement("li");
        li.textContent = s;
        schedule.appendChild(li);
      });

      document.getElementById("raw-json").textContent = JSON.stringify(m, null, 2);
      minutesView.style.display = "block";
    }

    minutesBtn.addEventListener("click", async () => {
      const meetingText = document.getElementById("meeting-text").value.trim();
      if (!meetingText) return alert("회의 내용을 입력하세요.");

      minutesBtn.disabled = true;
      minutesBtn.textContent = "생성 중...";
      try {
        const res = await fetch("/api/minutes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ meeting_text: meetingText }),
        });
        if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
        const data = await res.json();
        renderMinutes(data.minutes);
        countLabel.textContent = `(기억 중인 회의: ${data.meeting_count}건)`;
      } catch (err) {
        alert("오류: " + err.message);
      } finally {
        minutesBtn.disabled = false;
        minutesBtn.textContent = "회의록 생성";
      }
    });

    function renderCalendar(items) {
      document.getElementById("calendar-count").textContent = `(${items.length}건)`;
      const list = document.getElementById("calendar-list");
      list.innerHTML = "";
      items.forEach((c) => {
        const li = document.createElement("li");
        li.textContent = `${c.date}${c.time ? " " + c.time : ""} — ${c.title}`;
        list.appendChild(li);
      });
    }

    fetch("/api/calendar")
      .then((res) => res.json())
      .then((data) => renderCalendar(data.calendar));

    const askBtn = document.getElementById("ask-btn");
    const answerBox = document.getElementById("answer");

    askBtn.addEventListener("click", async () => {
      const question = document.getElementById("question").value.trim();
      if (!question) return alert("질문을 입력하세요.");

      askBtn.disabled = true;
      askBtn.textContent = "답변 중...";
      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
        const data = await res.json();
        answerBox.style.display = "block";
        answerBox.textContent = data.answer;
        countLabel.textContent = `(기억 중인 회의: ${data.meeting_count}건)`;
        if (data.calendar) renderCalendar(data.calendar);
      } catch (err) {
        answerBox.style.display = "block";
        answerBox.textContent = "오류: " + err.message;
      } finally {
        askBtn.disabled = false;
        askBtn.textContent = "질문하기";
      }
    });
  </script>
</body>
</html>
